<!doctype html>
<html lang="zh-CN" color-scheme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0e1017"><link rel="icon" href="data:,">
<title>Hangar · 虚拟办公室</title>
<style>
:root{color-scheme:dark;--canvas:#0e1017;--room:#161a27;--panel:#1a1e2b;--raised:#20263a;--line:#2b3145;--line2:#3a4564;--text:rgba(255,255,255,.88);--muted:rgba(255,255,255,.68);--faint:rgba(255,255,255,.48);--alive:#43d6a0;--wait:#f0a83a;--fail:#ef5a63;--focus:#7d8fd6;--ease:cubic-bezier(.23,1,.32,1)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--canvas);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;font-size:15px;line-height:1.55}button,input,select,textarea{font:inherit}button{touch-action:manipulation}::selection{background:#516093;color:#fff}:focus-visible{outline:2px solid var(--focus);outline-offset:3px}.skip{position:fixed;left:12px;top:-60px;z-index:100;background:#fff;color:#111;padding:8px 12px}.skip:focus{top:12px}.room{min-height:100dvh;display:flex;flex-direction:column;background:var(--canvas);position:relative}.room:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.025;background-image:linear-gradient(#fff 1px,transparent 1px),linear-gradient(90deg,#fff 1px,transparent 1px);background-size:46px 46px}.hud{position:relative;z-index:2;display:flex;align-items:center;gap:14px;padding:16px 22px;border-bottom:1px solid var(--line);background:#10131c}.brand{font-weight:600;letter-spacing:.02em;display:flex;align-items:center;gap:9px}.brand-mark{font-size:21px}.spacer{flex:1}.identity{color:var(--faint);font-size:13px}.focal{display:inline-flex;align-items:center;gap:8px;padding:7px 13px;border:1px solid var(--line2);border-radius:999px;background:var(--panel);font-weight:500;font-size:13px}.beacon{width:9px;height:9px;border-radius:50%;background:var(--faint);position:relative}.room[data-live="alive"] .beacon{background:var(--alive)}.room[data-live="warning"] .beacon{background:var(--wait)}.room[data-live="failed"] .beacon{background:var(--fail)}.room[data-live="alive"] .beacon:after{content:"";position:absolute;inset:-4px;border:1px solid var(--alive);border-radius:50%;animation:beacon 2.8s var(--ease) infinite}.hud-btn{min-height:38px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--muted);padding:0 12px}.status-error{margin:12px 22px 0;padding:10px 12px;border:1px solid #8b3b43;border-radius:9px;background:#3a2028;color:#ffc0c5}.status-error[hidden]{display:none}.active-run{margin:14px 22px 0;border:1px solid var(--line2);border-radius:11px;background:var(--panel);display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) auto;align-items:center;gap:16px;padding:13px 15px}.active-run[hidden]{display:none}.run-id,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}.run-id{font-size:12px;color:var(--faint)}.run-title{font-weight:600}.run-state{color:var(--alive)}.danger{min-height:40px;padding:0 13px;border:1px solid #9a4149;border-radius:7px;background:#3a2028;color:#ffd0d4}.stage{position:relative;z-index:1;flex:1;margin:14px 22px 22px;padding:28px 24px 80px;min-height:520px;border:1px solid #20273a;border-radius:18px;background:#111521;overflow:hidden}.stage:after{content:"";position:absolute;z-index:-1;left:5%;right:5%;bottom:8%;height:1px;background:#30384e;box-shadow:0 -96px 0 #1b2233}.stage-head{display:flex;align-items:end;justify-content:space-between;gap:16px;max-width:1100px;margin:0 auto 26px}.stage-head h1{margin:0;font-size:clamp(24px,3vw,36px);font-weight:600;letter-spacing:0;text-wrap:balance}.stage-head p{margin:0;color:var(--muted);font-size:14px}.desks{max-width:1100px;margin:auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,260px));justify-content:center;gap:22px;align-items:stretch}.desk{min-height:228px;border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--text);padding:18px 15px 14px;text-align:left;display:grid;grid-template-rows:1fr auto;cursor:pointer;transition:transform 120ms var(--ease),border-color 160ms var(--ease),background 160ms var(--ease)}.desk[aria-current="true"]{background:var(--raised);border-color:var(--focus)}.desk.vacant{border-style:dashed;opacity:.44;cursor:default;pointer-events:none}.desk.vacant .avatar{filter:grayscale(1)}.employee{display:grid;place-items:center;align-content:center}.avatar{font-size:60px;filter:saturate(.86)}.monitor{width:96px;height:34px;margin-top:-9px;border:1px solid var(--line2);border-radius:5px;background:#0f121a;position:relative}.monitor:after{content:"";position:absolute;width:34px;height:3px;background:var(--line2);left:30px;bottom:-7px}.monitor:before{content:"";position:absolute;inset:6px;background:#172039;border:1px solid #273354}.plate{border-top:1px solid var(--line);padding-top:12px}.plate strong{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.plate span{display:block;color:var(--muted);font-size:12px;margin-top:3px}.empty{max-width:1100px;margin:auto;padding:50px 20px;border:1px dashed var(--line2);border-radius:12px;text-align:center;color:var(--muted)}.drawer-backdrop{position:fixed;inset:0;z-index:20;background:#080a10aa;opacity:0;pointer-events:none;transition:opacity 180ms var(--ease)}.drawer{position:fixed;z-index:21;inset:0 0 0 auto;width:min(470px,94vw);background:#141827;border-left:1px solid var(--line2);padding:20px;overflow:auto;overscroll-behavior:contain;transform:translateX(100%);transition:transform 200ms var(--ease);box-shadow:-20px 0 60px #080a10aa}.drawer.open{transform:none}.drawer.open+.drawer-backdrop{opacity:1;pointer-events:auto}.drawer-head{display:flex;align-items:start;gap:12px;border-bottom:1px solid var(--line);padding-bottom:14px}.drawer-head h2{margin:0;font-size:21px;font-weight:600}.drawer-head p{margin:3px 0 0;color:var(--muted)}.icon-btn{margin-left:auto;width:42px;height:42px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--text);font-size:20px}.section{padding:18px 0;border-bottom:1px solid var(--line)}.section h3{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--faint);font-weight:500;margin:0 0 10px}.release-list{display:grid;gap:8px}.release{width:100%;min-height:44px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--text);text-align:left;padding:8px 10px}.release.selected{border-color:var(--focus);background:var(--raised)}.field{display:grid;gap:6px;margin-bottom:12px}.field label{font-weight:500}.field input,.field select,.field textarea{width:100%;min-height:44px;border:1px solid var(--line2);border-radius:8px;background:#0f121a;color:var(--text);padding:9px 10px}.primary{min-height:44px;border:1px solid #7786c8;border-radius:8px;background:#5967a4;color:#fff;padding:0 15px;font-weight:500}.primary[disabled]{opacity:.5}.timeline{list-style:none;padding:0;margin:0;display:grid}.timeline li{display:grid;grid-template-columns:80px 1fr;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}.timeline time{color:var(--faint);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.approval{border:1px solid #765b28;border-radius:9px;background:#302919;padding:12px;margin-top:10px}.approval-actions{display:flex;gap:8px;margin-top:10px}.approval-actions button{min-height:40px;flex:1}.confirm{position:fixed;inset:0;z-index:40;display:none;place-items:center;background:#080a10c7;padding:16px}.confirm.open{display:grid}.dialog{width:min(460px,100%);border:1px solid var(--line2);border-radius:12px;background:var(--raised);padding:20px;box-shadow:0 24px 80px #05070a}.dialog h2{margin:0 0 8px;font-size:20px}.dialog p{color:var(--muted)}.dialog-actions{display:flex;justify-content:flex-end;gap:8px}.toast{position:fixed;z-index:50;left:50%;bottom:20px;transform:translate(-50%,100px);background:var(--raised);border:1px solid var(--line2);border-radius:8px;padding:10px 14px;transition:transform 180ms var(--ease)}.toast.show{transform:translate(-50%,0)}.login{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:var(--canvas);padding:18px}.login[hidden]{display:none}.login-box{width:min(460px,100%);border:1px solid var(--line2);border-radius:14px;background:var(--panel);padding:24px}.login-box h1{font-size:25px;margin:0 0 5px}.login-box p{color:var(--muted);margin:0 0 18px}.login-error{min-height:24px;color:#ffb9bf;font-size:13px}.loading{opacity:.68;pointer-events:none}@keyframes beacon{0%,100%{transform:scale(.8);opacity:.8}50%{transform:scale(1.35);opacity:.15}}@media(hover:hover) and (pointer:fine){.desk:hover{transform:translateY(-2px);border-color:#4b587f}.hud-btn:hover,.release:hover{border-color:#566384}}@media(max-width:760px){.hud{padding:12px 14px;gap:8px}.identity{display:none}.focal{padding:6px 9px;font-size:11px}.active-run{margin:10px 14px 0;grid-template-columns:1fr auto}.active-run>div:nth-child(2){display:none}.stage{margin:10px 10px 16px;padding:22px 14px 70px;min-height:620px;border-radius:14px}.stage-head{display:block}.stage-head p{margin-top:4px}.desks{grid-template-columns:1fr}.desk{min-height:92px;display:grid;grid-template-columns:90px 1fr;grid-template-rows:1fr;padding:12px}.employee{grid-row:1}.avatar{font-size:36px}.plate{border-top:0;border-left:1px solid var(--line);padding:10px 0 0 14px}.desk.vacant{display:none}.drawer{inset:auto 0 0;width:100%;height:min(82dvh,700px);border-left:0;border-top:1px solid var(--line2);transform:translateY(100%);border-radius:14px 14px 0 0}.drawer.open{transform:none}.timeline li{grid-template-columns:68px 1fr}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<a class="skip" href="#office">跳到办公室</a>
<div class="room" id="room" data-live="unknown">
<header class="hud"><div class="brand"><span class="brand-mark" aria-hidden="true">🏢</span><span>Hangar 办公室</span></div><div class="spacer"></div><span class="identity" id="identity">单用户 Control</span><span class="focal"><i class="beacon"></i><span id="liveness">连接中…</span></span><button class="hud-btn" id="reauth" type="button">重新认证</button></header>
<div class="status-error" id="globalError" role="alert" hidden></div>
<section class="active-run" id="activeRun" hidden><div><div class="run-title" id="runTitle">当前 Run</div><div class="run-id" id="runId"></div></div><div><span class="run-state" id="runState"></span><div class="run-id" id="runMeta"></div></div><button class="danger" id="cancelRun" type="button">取消 Run</button></section>
<main class="stage" id="office"><div class="stage-head"><div><h1>虚拟办公室</h1><p>每个 Agent 是一名员工；房间灯光来自可信健康投影。</p></div><p id="officeCount"></p></div><div class="desks" id="desks"><div class="empty">正在连接 Control…</div></div></main>
<aside class="drawer" id="drawer" aria-labelledby="drawerTitle" aria-hidden="true"><div class="drawer-head"><div><h2 id="drawerTitle">Agent</h2><p id="drawerMeta"></p></div><button class="icon-btn" id="closeDrawer" type="button" aria-label="关闭详情">×</button></div><section class="section"><h3>Releases</h3><div class="release-list" id="releases"></div></section><section class="section"><h3>启动 Intent</h3><form id="intentForm"><div class="field"><label for="intentSelect">Intent</label><select id="intentSelect" required></select></div><div class="field"><label for="trigger">触发说明</label><input id="trigger" required maxlength="128" autocomplete="off" placeholder="例如：检查最新状态…"></div><button class="primary" id="startIntent" type="submit">启动 shadow-evaluator</button><div class="login-error" id="intentError" role="alert"></div></form></section><section class="section"><h3>Run 时间线</h3><ul class="timeline" id="timeline"><li><span></span><span>启动 Intent 后显示 committed events。</span></li></ul><button class="hud-btn" id="reconnect" type="button" hidden>重新连接时间线</button><div id="approvals"></div></section></aside><div class="drawer-backdrop" id="drawerBackdrop"></div>
<div class="confirm" id="confirm" role="dialog" aria-modal="true" aria-labelledby="confirmTitle"><div class="dialog"><h2 id="confirmTitle">确认操作</h2><p id="confirmMessage"></p><div class="dialog-actions"><button class="hud-btn" id="confirmCancel" type="button">返回</button><button class="danger" id="confirmAction" type="button">确认</button></div></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<section class="login" id="login" aria-labelledby="loginTitle"><form class="login-box" id="loginForm"><h1 id="loginTitle">进入 Hangar 办公室</h1><p>粘贴 bootstrap，仅用于本次 session exchange；页面不会保存它。</p><div class="field"><label for="bootstrap">Bootstrap credential</label><textarea id="bootstrap" required spellcheck="false" autocomplete="off" rows="3" placeholder="粘贴 bootstrap…"></textarea></div><div class="login-error" id="loginError" role="alert"></div><button class="primary" id="loginButton" type="submit">建立安全会话</button></form></section>
</div>
<script type="module" src="/hangar-view.js"></script>
</body></html>
