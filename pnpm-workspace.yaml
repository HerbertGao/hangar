packages:
  - packages/*
  - apps/*
  # 外部 pilot checkout(symlink 进来的,见 .gitignore 的 /apps/inbox)**必须**排除在 workspace 之外。
  # 它自带 package.json + pnpm-lock.yaml + node_modules,依赖由它自己的 repo 管;被 `apps/*` 收进来
  # 只有害处:pnpm 会把它的依赖算进本仓的 lockfile 校验,而本仓的 lockfile 是在 CI/dependabot 上
  # (那里 symlink 目标不存在、inbox 压根不可见)生成的 —— 于是**任何**能解析到该 symlink 的机器
  # (开发机与生产机都算)跑 `--frozen-lockfile` 都会失败,报 inbox 的十几个依赖「lockfile 不匹配」。
  # 这条在 CI 上永远不会暴露,正因为 CI 是那个看不见它的地方。
  # 判据:`pnpm ls -r --depth -1` 里**不该**出现 `inbox-pilot`。
  - '!apps/inbox'

# build 脚本批准名单。**住这里是因为 pnpm 10 与 11 都读这个位置** —— 旧位置(根 package.json 的
# "pnpm" 字段)自 pnpm 11 起才不再被读取,10 仍然读它。
#
# 名单落在一个不被读的位置是最坑的状态:install **退 0**,日志只多一行 `Ignored build scripts: ...`,
# 而原生模块的 .node 根本没产出,直到运行时才炸 `Could not locate the bindings file`。
# 故判据永远是「.node 真的产出了」,不是「install 退 0」、也不是「没看到警告」。
# (产出了但 ABI 不对是另一种失败,报 ERR_DLOPEN_FAILED,判据见 upgrade-node-24 的 tasks 1.3。)
#
# 陷阱:`The "pnpm" field ... is no longer read` 这条警告可能是 PATH 上外层的 pnpm 11 在委派给
# packageManager 钉住的 10 **之前**打的,不代表实际执行那次 install 的版本的行为。要判断被钉版本
# 的行为,直接跑它的 bundle:`node ~/.cache/node/corepack/v1/pnpm/<版本>/bin/pnpm.cjs`。
onlyBuiltDependencies:
  - better-sqlite3
  - esbuild
